<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <script>(function(){var t=localStorage.getItem('pokedoc-theme');var d=t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.dataset.theme=d?'dark':'light';})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curso — PokeDoc</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1e5175" />
  <link rel="apple-touch-icon" href="/assets/icon-192.png" />
  <meta name="description" content="Curso interactivo paso a paso sobre Pokémon TCG." />
  <!-- meta-social:inicio -->
  <meta property="og:site_name" content="PokeDoc" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="es_ES" />
  <meta property="og:title" content="Curso — PokeDoc" />
  <meta property="og:description" content="Curso interactivo paso a paso sobre Pokémon TCG." />
  <meta property="og:image" content="https://pokedoc.es/assets/images/og-default.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Curso — PokeDoc" />
  <meta name="twitter:description" content="Curso interactivo paso a paso sobre Pokémon TCG." />
  <meta name="twitter:image" content="https://pokedoc.es/assets/images/og-default.png" />
  <!-- meta-social:fin -->
  <link rel="preload" href="/assets/fonts/inter-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/assets/fonts/fredoka-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
  <!-- Estos seis módulos los carga TODA página. Sin esto el navegador
       los descubre en cascada —la página pide su .js, ese pide app.js,
       app.js pide supabase.js y ese el bundle de 152 KB—, y cada salto
       es un viaje de ida y vuelta más antes de poder pintar. Con
       modulepreload se piden los seis a la vez, desde el primer momento.
       Van estos y no todo el grafo a propósito: son los que no cambian
       de página a página, así que no se quedan obsoletos solos. -->
  <link rel="modulepreload" href="/js/vendor/supabase-js.js" />
  <link rel="modulepreload" href="/js/supabase.js" />
  <link rel="modulepreload" href="/js/app.js" />
  <link rel="modulepreload" href="/js/icons.js" />
  <link rel="modulepreload" href="/js/content-icon.js" />
  <link rel="modulepreload" href="/js/html.js" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/curso.css" />
</head>
<body>
  <div class="curso-layout">
    <div class="curso-progress-bar">
      <div class="curso-progress-fill" id="progressFill"></div>
    </div>
    <button class="btn-back" id="btnBack">Salir</button>

    <!-- El marcador. Sin nada que suba en pantalla, acertar y fallar se
         sienten igual, y eso es lo que hacía que esto pareciera un
         examen en vez de un juego. -->
    <div class="curso-hud hidden" id="cursoHud" aria-live="polite">
      <span class="hud-racha hidden" id="hudRacha"></span>
      <span class="hud-puntos"><strong id="hudPuntos">0</strong> pts</span>
    </div>

    <div class="curso-stage" id="cursoStage">
      <p class="empty-state">Cargando curso…</p>
    </div>

    <div class="curso-footer">
      <button class="btn-previous hidden" id="btnPrevious">← Anterior</button>
      <button class="btn-continue" id="btnContinue">Continuar →</button>
    </div>
  </div>

  <script type="module" src="js/curso.js"></script>
</body>
</html>
