[functions]
  directory = "netlify/functions"

# El SyntaxError "Importing binding name 'guideHasCourse' is not found" que
# apareció en el registro de errores es caché desincronizada: el navegador
# tenía en caché un js/app.js viejo (sin ese export) y pidió un
# js/guide-modal.js nuevo (que sí lo importa). Como los ficheros no llevan
# huella en el nombre, un despliegue puede dejar esa mezcla y la página se
# queda en blanco, porque un módulo que no resuelve un import no ejecuta
# nada.
#
# Forzar la revalidación en cada carga hace que el navegador pregunte
# siempre si su copia sigue valiendo. Sigue usando la caché cuando el
# fichero no ha cambiado (responde 304), así que no penaliza.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# El dominio bueno es pokedoc.es. Quien llegue al subdominio de Netlify
# (por un enlace antiguo, o porque un redirect de Supabase le ha mandado
# ahí después de iniciar sesión) se manda a pokedoc.es conservando la
# ruta. Va la PRIMERA porque Netlify aplica la primera regla que coincide.
#
# Solo coincide con el subdominio de producción exacto: las previsualiza-
# ciones de despliegue (deploy-preview-N--pokedocpingu.netlify.app y
# rama--pokedocpingu.netlify.app) no encajan en el patrón y siguen
# funcionando en su propia URL.
[[redirects]]
  from = "https://pokedocpingu.netlify.app/*"
  to = "https://pokedoc.es/:splat"
  status = 301
  force = true

# Enlaces de perfil legibles: /usuario/<nombre-de-usuario> en vez de
# /usuario.html?u=<nombre-de-usuario>. Tiene que ir ANTES del catch-all de
# abajo — Netlify aplica la primera regla que coincide.
[[redirects]]
  from = "/usuario/:username"
  to = "/usuario.html?u=:username"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
