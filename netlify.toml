[functions]
  directory = "netlify/functions"

# Las Edge Functions viven en netlify/edge-functions/, que es donde
# Netlify las busca por defecto; cada fichero declara sus rutas en su
# propio `export const config`. Hoy solo hay una: meta-social.js, que
# rellena la vista previa de los enlaces al compartirlos.

# El SyntaxError "Importing binding name 'guideHasCourse' is not found" que
# apareció en el registro de errores es caché desincronizada: el navegador
# tenía en caché un js/app.js viejo (sin ese export) y pidió un
# js/guide-modal.js nuevo (que sí lo importa). Como los ficheros no llevan
# huella en el nombre, un despliegue puede dejar esa mezcla y la página se
# queda en blanco, porque un módulo que no resuelve un import no ejecuta
# nada.
#
# Forzar la revalidación en cada carga hace que el navegador pregunte
# siempre si su copia sigue valiendo. Sigue usando la caché cuando el
# fichero no ha cambiado (responde 304), así que no penaliza.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# js/vendor/ es la excepción: son librerías empaquetadas (Supabase,
# DOMPurify) que solo cambian cuando se regeneran a mano. Revalidar 210 KB
# en cada carga de página no tiene sentido — se cachean un año.
#
# Va DESPUÉS de la regla de /js/* a propósito: Netlify aplica la más
# específica que coincida, y esta lo es.
[[headers]]
  for = "/js/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El dominio bueno es pokedoc.es. Quien llegue al subdominio de Netlify
# (por un enlace antiguo, o porque un redirect de Supabase le ha mandado
# ahí después de iniciar sesión) se manda a pokedoc.es conservando la
# ruta. Va la PRIMERA porque Netlify aplica la primera regla que coincide.
#
# Solo coincide con el subdominio de producción exacto: las previsualiza-
# ciones de despliegue (deploy-preview-N--pokedocpingu.netlify.app y
# rama--pokedocpingu.netlify.app) no encajan en el patrón y siguen
# funcionando en su propia URL.
[[redirects]]
  from = "https://pokedocpingu.netlify.app/*"
  to = "https://pokedoc.es/:splat"
  status = 301
  force = true

# Baja de los avisos por correo con una ruta corta. Va aquí, y no se deja
# en `/.netlify/functions/baja-correo`, porque esta URL se enseña en el pie
# de cada correo y viaja en la cabecera List-Unsubscribe: una URL larga y
# con pinta de tripas del servidor es de las que hacen que alguien
# desconfíe y le dé a "marcar como spam" en vez de a darse de baja.
#
# Es una reescritura (200) y no un redirect a propósito: la baja de un
# clic de RFC 8058 manda un POST, y un 301/302 lo convertiría en GET por
# el camino, así que el botón de Gmail dejaría de funcionar.
[[redirects]]
  from = "/baja-correo"
  to = "/.netlify/functions/baja-correo"
  status = 200

# El sitemap lo genera una función, para que incluya las guías y las
# categorías publicadas (ver netlify/functions/sitemap.mjs). Ya no existe
# el fichero estático sitemap.xml; `force = true` está de todos modos para
# que, si alguien vuelve a añadirlo, no gane silenciosamente y deje el
# sitemap congelado sin que se note.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

# Enlaces de perfil legibles: /usuario/<nombre-de-usuario> en vez de
# /usuario.html?u=<nombre-de-usuario>. Tiene que ir ANTES del catch-all de
# abajo — Netlify aplica la primera regla que coincide.
[[redirects]]
  from = "/usuario/:username"
  to = "/usuario.html?u=:username"
  status = 200

# Lo mismo en el foro: /foro/<slug-del-foro> y /tema/<id>. `/foro` a secas
# no necesita regla, porque Netlify sirve foro.html antes de llegar al
# catch-all; estas dos sí, porque no existe ningún fichero con ese nombre.
[[redirects]]
  from = "/foro/:slug"
  to = "/foro.html?f=:slug"
  status = 200

[[redirects]]
  from = "/tema/:id"
  to = "/tema.html?t=:id"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
