<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <script>(function(){var t=localStorage.getItem('pokedoc-theme');var d=t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.dataset.theme=d?'dark':'light';})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nueva contraseña — PokeDoc</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <meta name="robots" content="noindex" />
  <link rel="preload" href="/assets/fonts/inter-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/assets/fonts/fredoka-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
  <!-- Estos seis módulos los carga TODA página. Sin esto el navegador
       los descubre en cascada —la página pide su .js, ese pide app.js,
       app.js pide supabase.js y ese el bundle de 152 KB—, y cada salto
       es un viaje de ida y vuelta más antes de poder pintar. Con
       modulepreload se piden los seis a la vez, desde el primer momento.
       Van estos y no todo el grafo a propósito: son los que no cambian
       de página a página, así que no se quedan obsoletos solos. -->
  <link rel="modulepreload" href="/js/vendor/supabase-js.js" />
  <link rel="modulepreload" href="/js/supabase.js" />
  <link rel="modulepreload" href="/js/app.js" />
  <link rel="modulepreload" href="/js/icons.js" />
  <link rel="modulepreload" href="/js/content-icon.js" />
  <link rel="modulepreload" href="/js/html.js" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-box">
      <div class="auth-logo">Poke<span>Doc</span></div>

      <div id="stepReset">
        <h2>Elige una nueva contraseña</h2>
        <p class="subtext">Escribe tu nueva contraseña para tu cuenta.</p>
        <div class="form-group" style="margin-top: 16px;">
          <input type="password" id="newPassword" class="auth-input" placeholder="Nueva contraseña (mín. 8, con mayúscula, minúscula, número y símbolo)" autocomplete="new-password" autofocus />
        </div>
        <p class="auth-error"></p>
        <button id="btnSavePassword" class="btn-primary btn-block" style="margin-top: 8px;">Guardar contraseña</button>
      </div>

      <div id="stepInvalid" class="hidden">
        <h2>Enlace no válido</h2>
        <p class="subtext">Este enlace de recuperación no es válido o ha caducado. Pide uno nuevo desde la pantalla de inicio de sesión.</p>
        <a href="auth.html" class="btn-primary btn-block" style="margin-top: 8px;">Volver a entrar</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/reset-password.js"></script>
</body>
</html>
