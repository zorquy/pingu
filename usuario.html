<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil — PokeDoc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">Poke<span>Doc</span></a>
      <div class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="aprender.html">Aprender</a>
        <a href="buscar.html">Buscar</a>
        <a href="guardados.html">Guardados</a>
        <a href="usuarios.html">Comunidad</a>
      </div>
      <div class="nav-right">
        <div id="nav-user"></div>
        <button class="nav-toggle" id="navToggle" aria-label="Menú"><span></span><span></span><span></span></button>
      </div>
    </div>
    <div class="nav-menu-mobile" id="navMobileMenu">
      <a href="index.html">Inicio</a>
      <a href="aprender.html">Aprender</a>
      <a href="buscar.html">Buscar</a>
      <a href="guardados.html">Guardados</a>
      <a href="usuarios.html">Comunidad</a>
    </div>
  </nav>

  <main class="page-content container-narrow">
    <div class="profile-header" id="profileHeader">
      <div class="skeleton" style="width: 72px; height: 72px; border-radius: 50%;"></div>
    </div>

    <button class="btn-primary hidden" id="btnFollowToggle" style="margin-bottom: 20px;"></button>

    <div class="stats-row" style="margin-bottom: 20px;" id="profileStats"></div>

    <div class="tabs" id="profileTabs">
      <button class="tab-btn active" data-ptab="wall">Muro</button>
      <button class="tab-btn" data-ptab="guides">Guías</button>
      <button class="tab-btn" data-ptab="about">Acerca</button>
    </div>

    <div class="tab-panel active" id="ptab-wall">
      <div id="commentForm" style="margin-bottom: 16px;"></div>
      <div id="commentsList"></div>
    </div>

    <div class="tab-panel" id="ptab-guides">
      <h2 class="section-title">Guías publicadas</h2>
      <div id="publishedGuides"></div>
    </div>

    <div class="tab-panel" id="ptab-about">
      <div class="about-block">
        <div class="follow-summary-row">
          <button class="follow-summary-item" id="btnShowFollowing" type="button"><strong id="followingCount">0</strong><span>Siguiendo</span></button>
          <button class="follow-summary-item" id="btnShowFollowers" type="button"><strong id="followersCount">0</strong><span>Seguidores</span></button>
        </div>
        <div class="follow-avatar-row hidden" id="followingList"></div>
        <div class="follow-avatar-row hidden" id="followersList"></div>
      </div>

      <h2 class="section-title">Trofeos</h2>
      <div class="achievements-grid about-block" id="achievementsGrid"></div>

      <h2 class="section-title">Reseñas</h2>
      <div id="reviewForm" style="margin-bottom: 16px;"></div>
      <div id="reviewsList"></div>
    </div>
  </main>

  <footer class="footer">© 2026 PokeDoc — Hecho para coleccionistas.</footer>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/usuario.js"></script>
</body>
</html>
